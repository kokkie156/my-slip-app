<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบคีย์โพยหวย & จัดการโพย (Firebase Realtime)</title>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase JS SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Sarabun', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex justify-between items-center bg-slate-800 p-4 rounded-xl border border-slate-700 shadow-lg">
      <h1 class="text-xl md:text-2xl font-bold text-amber-400 flex items-center gap-2">
        <i class="fa-solid fa-receipt"></i> ระบบคีย์โพยหวยออนไลน์
      </h1>
      <span id="sync-status" class="text-sm px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">
        <i class="fa-solid fa-spinner fa-spin mr-1"></i> กำลังเชื่อมต่อ...
      </span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- ฟอร์มป้อนข้อมูล (Left Column) -->
      <div class="lg:col-span-5 bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
        <h2 class="text-lg font-semibold text-slate-200 border-b border-slate-700 pb-2">
          <i class="fa-solid fa-pen-to-square text-indigo-400 mr-1"></i> คีย์โพยใหม่
        </h2>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">ชื่อลูกค้า / ชื่อโพย</label>
          <input type="text" id="customerName" placeholder="เช่น พี่กี้, โพยชุด A" 
                 class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-400 mb-1">รายการตัวเลข (รูปแบบ: ตัวเลข=บน/ล่าง)</label>
          <textarea id="lottoInput" rows="6" placeholder="ตัวอย่าง:&#10;123=100x100&#10;45=50x50&#10;99=100" 
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white font-mono text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button onclick="saveSlip()" id="btnSave" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> บันทึกโพยลง Firebase
        </button>
      </div>

      <!-- ตารางแสดงโพย & สรุปยอด (Right Column) -->
      <div class="lg:col-span-7 space-y-6">
        
        <!-- สรุปยอดรวม -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <span class="text-xs text-slate-400">จำนวนโพยทั้งหมด</span>
            <div id="totalSlips" class="text-2xl font-bold text-indigo-400 mt-1">0</div>
          </div>
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center">
            <span class="text-xs text-slate-400">ยอดรวมทั้งหมด (บาท)</span>
            <div id="totalAmount" class="text-2xl font-bold text-emerald-400 mt-1">0</div>
          </div>
          <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 text-center col-span-2 sm:col-span-1">
            <span class="text-xs text-slate-400">สถานะระบบ</span>
            <div id="dbStatus" class="text-sm font-semibold text-slate-300 mt-2">Online</div>
          </div>
        </div>

        <!-- รายการโพยทั้งหมด -->
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg space-y-4">
          <div class="flex justify-between items-center border-b border-slate-700 pb-2">
            <h2 class="text-lg font-semibold text-slate-200">
              <i class="fa-solid fa-list-check text-emerald-400 mr-1"></i> รายการโพยออนไลน์
            </h2>
            <button onclick="clearAllSlips()" class="text-xs text-rose-400 hover:text-rose-300 transition">
              <i class="fa-solid fa-trash-can mr-1"></i> ลบทั้งหมด
            </button>
          </div>

          <div id="slipList" class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
            <!-- โพยจะถูกเรนเดอร์ตรงนี้แบบ Real-time -->
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    // ==========================================
    // 1. ตั้งค่า Firebase Config (วางค่าของคุณที่นี่)
    // ==========================================
  const firebaseConfig = {
  apiKey: "AIzaSyCpPAT4t0DLqhP27EMesy3KNsEJsCxF_yo",
  authDomain: "my-slip-app-eb762.firebaseapp.com",
  databaseURL: "https://my-slip-app-eb762-default-rtdb.firebaseio.com", // <-- เพิ่มบรรทัดนี้
  projectId: "my-slip-app-eb762",
  storageBucket: "my-slip-app-eb762.firebasestorage.app",
  messagingSenderId: "75683810457",
  appId: "1:75683810457:web:d9f7ff6e0b013588783c08",
  measurementId: "G-DB7CPJ8170"
};
    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const slipsRef = db.ref('slips');

    // ตรวจสอบการเชื่อมต่อ Real-time
    db.ref('.info/connected').on('value', (snap) => {
      const syncStatus = document.getElementById('sync-status');
      if (snap.val() === true) {
        syncStatus.className = "text-sm px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        syncStatus.innerHTML = `<i class="fa-solid fa-wifi mr-1"></i> ออนไลน์ (Real-time)`;
      } else {
        syncStatus.className = "text-sm px-3 py-1 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
        syncStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation mr-1"></i> ขาดการเชื่อมต่อ`;
      }
    });

    // ==========================================
    // 2. ฟังก์ชันบันทึกโพยใหม่ลง Firebase
    // ==========================================
    function saveSlip() {
      const nameInput = document.getElementById('customerName');
      const lottoInput = document.getElementById('lottoInput');

      const name = nameInput.value.trim() || 'ไม่ระบุชื่อ';
      const rawText = lottoInput.value.trim();

      if (!rawText) {
        alert('กรุณากรอกรายการตัวเลขก่อนบันทึก');
        return;
      }

      // คำนวณยอดรวมคร่าวๆ
      let total = 0;
      const lines = rawText.split('\n');
      lines.forEach(line => {
        const parts = line.split('=');
        if (parts.length === 2) {
          const prices = parts[1].split('x');
          prices.forEach(p => {
            const val = parseFloat(p.trim());
            if (!isNaN(val)) total += val;
          });
        }
      });

      const slipData = {
        customerName: name,
        rawText: rawText,
        totalAmount: total,
        timestamp: Date.now()
      };

      // Push ลง Firebase
      slipsRef.push(slipData).then(() => {
        nameInput.value = '';
        lottoInput.value = '';
      }).catch((err) => {
        alert('เกิดข้อผิดพลาดในการบันทึก: ' + err.message);
      });
    }

    // ==========================================
    // 3. ดึงและซิงค์ข้อมูล Real-time ทุกเครื่อง
    // ==========================================
    slipsRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const slipListDiv = document.getElementById('slipList');
      slipListDiv.innerHTML = '';

      let totalCount = 0;
      let grandTotal = 0;

      if (!data) {
        slipListDiv.innerHTML = `<div class="text-center text-slate-500 py-8">ยังไม่มีรายการโพย</div>`;
        document.getElementById('totalSlips').innerText = '0';
        document.getElementById('totalAmount').innerText = '0';
        return;
      }

      // แปลง Object เป็น Array แล้วเรียงลำดับตามเวลานำเข้าล่าสุดขึ้นก่อน
      const entries = Object.entries(data).reverse();

      entries.forEach(([id, slip]) => {
        totalCount++;
        grandTotal += (slip.totalAmount || 0);

        const dateStr = new Date(slip.timestamp).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });

        const itemHtml = `
          <div class="bg-slate-900 border border-slate-700 rounded-lg p-3 space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-amber-400 text-sm">👤 ${escapeHtml(slip.customerName)}</span>
              <div class="flex items-center gap-2">
                <span class="text-xs text-slate-400">${dateStr}</span>
                <button onclick="deleteSlip('${id}')" class="text-rose-400 hover:text-rose-300 text-xs px-1">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>
            <pre class="font-mono text-xs text-slate-300 bg-slate-950 p-2 rounded border border-slate-800 whitespace-pre-wrap">${escapeHtml(slip.rawText)}</pre>
            <div class="text-right text-xs font-semibold text-emerald-400">
              รวม: ${(slip.totalAmount || 0).toLocaleString()} บาท
            </div>
          </div>
        `;
        slipListDiv.innerHTML += itemHtml;
      });

      document.getElementById('totalSlips').innerText = totalCount.toLocaleString();
      document.getElementById('totalAmount').innerText = grandTotal.toLocaleString();
    });

    // ลบโพยเดี่ยว
    function deleteSlip(id) {
      if (confirm('ยืนยันการลบโพยนี้?')) {
        db.ref(`slips/${id}`).remove();
      }
    }

    // ลบโพยทั้งหมด
    function clearAllSlips() {
      if (confirm('⚠️ ต้องการลบรายการโพยทั้งหมดในระบบใช่หรือไม่?')) {
        slipsRef.remove();
      }
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
